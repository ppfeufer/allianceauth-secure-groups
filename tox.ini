[tox]
isolated_build = true
skipsdist = true
usedevelop = true
envlist = py3

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE = tests.test_settings
deps=
    allianceauth>=5.6.0
    coverage

install_command = pip install -e ".[test]" -U {opts} {packages}

commands=
    coverage run runtests.py securegroups -v 2 --debug-mode
    pip list
    coverage xml
    coverage html
    coverage report -m
